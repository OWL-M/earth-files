[package]
name = "earth-files"
version = "1.9.0"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

# Register the `wayland_platform` cfg alias so vendored code such as
# `src/ui/widget/autosize.rs` can use `#[cfg(wayland_platform)]` without an unknown-cfg
# warning. The cfg remains unset, so the guarded code is excluded.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wayland_platform)'] }

[dependencies]
anyhow = "1"
jiff = "0.2"
jiff-icu = "0.2"
icu = { version = "2.2.0", features = ["compiled_data"] }
cosmic-mime-apps = { git = "https://github.com/pop-os/cosmic-mime-apps.git", optional = true }
derive_setters = "0.1.9"
dirs = "7.0.0"
freedesktop-desktop-entry = "0.8"
apply = "0.3.0"
# Icon-theme lookup for the vendored `ui::widget::icon`.
freedesktop-icons = { git = "https://github.com/id3v1669/freedesktop-icons" }
gio = { version = "0.22", optional = true }
glib = { version = "0.22", optional = true }
glob = "0.3"
ignore = "0.4"
image = "0.25"
image-extras = { version = "0.1.0", default-features = false, features = ["xpm", "xbm"] }
libc = "0.2"
log = "0.4"
mime_guess = "2"
mundy = { version = "0.2", default-features = false, features = ["color-scheme", "tokio"] }
notify-debouncer-full = "0.7"
notify-rust = { version = "4", optional = true }
open = "5.3.4"
# Colour type for `ui::theme`'s palette.
palette = "0.7.7"
regex = "1"
ron = "0.12"
roxmltree = "0.21"
rustc-hash = "2.1"
serde = { version = "1", features = ["serde_derive"] }
shlex = { version = "2.0" }
unicode-segmentation = "1.13"
taffy = { version = "0.14.0", features = ["grid"] }
tempfile = "3"
tikv-jemallocator = { version = "0.7", optional = true }
tokio = { version = "1", features = ["process", "sync"] }
trash = "5.2.6"
url = "2.5"
uzers = "0.12.2"
walkdir = "2.5.0"
# Wayland protocol support for `ui::dnd`. Required because this app only supports
# Wayland.
wayland-client = "0.31.14"
xdg = { version = "3.0", optional = true }
xdg-mime = { git = "https://github.com/ebassi/xdg-mime-rs" }
# Raw D-Bus for the one portal read `ui::icon_theme` makes:
# `org.freedesktop.portal.Settings`, which `mundy` has no interest for.
# Declared at the version already in the tree, so cargo unifies the two.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Compression
bzip2 = { version = "0.6", optional = true }
flate2 = "1.1"
fork = "0.10"
tar = "0.4.45"
lzma-rust2 = { version = "0.21", optional = true }
ordermap = { version = "1.2.0", features = ["serde"] }
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"
slotmap = "1.1.1"
recently-used-xbel = "1.2.0"
zip = "8"
md-5 = "0.11"
sha2 = "0.11"
png = "0.18"
procfs = "0.18"
jxl-oxide = { version = "0.12.5", features = ["image"] }
num_cpus = "1.17.0"
filetime = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
atomic_float = "1.1.0"
num_enum = "0.7.6"
bstr = "1.12.1"

# Completion-based IO runtime to enable io_uring / IOCP file IO support.
[dependencies.compio]
version = "0.19"
default-features = false
features = ["fs", "io", "macros", "polling", "runtime"]

# Features: iced 0.14's `default` is
#   wgpu, tiny-skia, crisp, web-colors, thread-pool, linux-theme-detection,
#   x11, wayland
# `wgpu` is routed through this crate's own `wgpu` feature (below) rather than
# pinned on here; `x11` is left off (Wayland only) and `web-colors` is left off
# deliberately (see the note in the list). The rest of default is kept.
#
# Added on top:
#   advanced:             `iced::advanced::` uses, plus every vendored widget
#   advanced-shaping:     `Shaping::Advanced` sites
#   image-without-codecs: `widget::image::Handle` in icon/large_image
#   svg:                  `iced::widget::svg`
#   canvas:               `iced::widget::canvas`
#   tokio:                `iced::time::every`
[dependencies.iced]
version = "0.14"
default-features = false
features = [
    "tiny-skia",
    # Give `softbuffer` a backend for tiny-skia, independently of winit. This app only
    # supports Wayland, so it does not enable the corresponding `x11` feature.
    "wayland",
    "crisp",
    # Leave `web-colors` disabled. It sets `GAMMA_CORRECTION = false`
    # (`iced_graphics/src/color.rs`), which makes the wgpu compositor choose the first
    # non-sRGB surface format (`iced_wgpu/src/window/compositor.rs`). On a 10-bit
    # display, that is `Rgb10a2Unorm`: 8-bit colour values are packed into a 10-bit
    # surface without gamma handling. Disabling the feature selects an sRGB format and
    # lets the GPU convert the colours.
    "thread-pool",
    "linux-theme-detection",
    "advanced",
    "advanced-shaping",
    "image-without-codecs",
    "lazy",
    "svg",
    "canvas",
    "tokio",
]

# Wayland shell (popups, menus) for iced 0.14, which has no `platform_specific`
# module of its own. Carried through `[patch.crates-io]` below.
# `iced::core` and `iced::runtime` are private in `iced`, so `iced_core::` and
# `iced_runtime::` paths are spelled against these crates directly. Same crates
# iced itself depends on, at the same version, so they resolve to the one shared
# instance.
[dependencies.iced_core]
version = "0.14"

[dependencies.iced_runtime]
version = "0.14"

[dependencies.iced_exwlshell]
version = "0.20.1"

# `iced_core 0.14` does not re-export `cosmic_text::Affinity`, so it is used
# directly. `cargo tree -i cosmic-text` shows one `v0.15.0`, used by
# `iced_graphics`, `iced_tiny_skia` and `cryoglyph`. Depend on the same version
# to share that instance.
[dependencies.cosmic-text]
version = "0.15"

[[example]]
name = "gio-list"
required-features = ["gvfs"]

[[example]]
name = "gio-mount"
required-features = ["gvfs"]

[[example]]
name = "gvfs"
required-features = ["gvfs"]

[features]
# Not enabled anywhere; declared only so vendored widgets carrying
# `#[cfg(feature = "a11y")]` don't trip `unexpected_cfgs`.
a11y = []
default = [
    "bzip2",
    "desktop",
    "gvfs",
    "io-uring",
    "lzma-rust2",
    "notify",
    "wgpu",
]
desktop = ["dep:cosmic-mime-apps", "dep:xdg"]
gvfs = ["dep:gio", "dep:glib"]
io-uring = ["compio/io-uring"]
jemalloc = ["dep:tikv-jemallocator"]
notify = ["dep:notify-rust"]
wgpu = ["iced/wgpu"]

[profile.dev]
opt-level = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[build-dependencies]
xdgen = "0.1"

[dev-dependencies]
# cap-std = "3"
# cap-tempfile = "3"
fastrand = "2"
test-log = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }

[patch.crates-io]
exwlshellev             = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
iced_exwlshell          = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
iced_exwlshell_macros   = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
iced_wayland_subscriber = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
iced_exdevtools         = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
waycrate_xkbkeycode     = { git = "https://github.com/id3v1669/exwlshelleventloop", branch = "xxas" }
